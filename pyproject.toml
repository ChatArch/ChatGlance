[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ChatGlance"
dynamic = ["version"]
description = "ChatArch Glance website deployment helpers and records."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "click>=8.0",
    "chatstyle>=0.2.0,<0.3.0",
    "chatenv>=0.2.10,<0.3.0",
    "PyYAML>=6.0,<7.0",
    "tomli>=1.1.0; python_version < '3.11'",
]
authors = [{name = "ChatArch", email = "1073853456@qq.com"}]
keywords = ["chatglance", "chatarch", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ChatArch/ChatGlance"
Repository = "https://github.com/ChatArch/ChatGlance"

[project.scripts]
chatglance = "chatglance.cli:main"

[project.entry-points."chatenv.configs"]
chatglance = "chatglance.config"

[project.optional-dependencies]
dev = ["build", "pytest", "twine"]

[tool.setuptools.dynamic]
version = {attr = "chatglance.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true
