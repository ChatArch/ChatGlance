# Example Infra/server inventory config for `chatglance servers`.
# Keep real SSH aliases and auth material outside public artifacts.

page:
  # The current ChatArch site uses the Chinese page name, but this can also be
  # changed to `Infra` if the Glance navigation should expose an English label.
  name: "服务器"
  slug: "servers"
  widget_title: "服务器状态"

inventory:
  # When true, ChatGlance scans SSH config aliases and applies its safe default
  # filter for server-dashboard candidates. Add explicit `hosts` below for a
  # reviewed, deterministic inventory.
  default_candidates: false

  # Optional extra aliases. Usually prefer `hosts` so labels are documented.
  aliases: []

  # Aliases to keep out of the page even if they appear in default candidates.
  # Use this for laptops, local-only test boxes, retired hosts, or aliases that
  # point at the same machine through a second account.
  exclude: []

  # Add reviewed SSH aliases/optional overrides only in your private runtime
  # inventory. Examples are deliberately empty to prevent accidental probing.
  # Each host that may reuse last-good data needs a reviewed connection identity
  # (`hostname`, `port`, `user`). `server_id` is optional; when omitted it is
  # derived from alias plus that identity. An explicit stable ID may be used, e.g.:
  # - alias: "infra-primary"
  #   server_id: "datacenter-primary-01"
  #   hostname: "192.0.2.10"
  #   port: 22
  #   user: "service-user"
  # For an explicitly reviewed DNS legacy migration only, the same host may
  # include `legacy_identities: [{approved: true, ip: "192.0.2.10", port: 22,
  # user: "service-user"}]`. Alias-only legacy matching is never performed.
  hosts: []

collection:
  timeout: 18
  workers: 8
