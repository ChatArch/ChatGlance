# Review before enabling. Replace example.invalid, terminate HTTPS at this
# server or at a trusted front proxy, and set CHATGLANCE_PUBLIC_ORIGIN to the
# exact external HTTPS origin. Never expose either upstream loopback port.
server {
    listen 80;
    server_name example.invalid;

    location = /项目 { return 308 /projects; }
    location = /项目/ { return 308 /projects; }

    location ^~ /_chatglance/reset-policy/ {
        proxy_pass http://127.0.0.1:5679/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
