name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,docs]"
      - run: python -m pytest -q
      - name: Strict bilingual documentation build
        if: matrix.python-version == '3.10'
        run: mkdocs build --strict
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify installed wheel CLI (not editable source)
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: chatglance --version
      - run: chatglance --tree
      - run: chatglance --tree-brief
