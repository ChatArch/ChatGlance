site_name: ChatGlance
site_url: !ENV [CHATGLANCE_DOCS_SITE_URL, 'https://arch.gh.wzhecnu.cn/ChatGlance/']
site_description: ChatGlance 的单入口访问、页面生成与安全刷新说明
repo_url: https://github.com/ChatArch/ChatGlance
docs_dir: docs/site
theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - search.suggest
plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: false
      languages:
        - locale: zh
          name: 简体中文
          default: true
          nav_translations:
            首页: 首页
            快速开始: 快速开始
            命令索引: 命令索引
            项目与访问: 项目与访问
            刷新与运行: 刷新与运行
            架构与能力: 架构与能力
        - locale: en
          name: English
          nav_translations:
            首页: Home
            快速开始: Quickstart
            命令索引: CLI reference
            项目与访问: Projects and access
            刷新与运行: Refresh and operations
            架构与能力: Architecture and capabilities
markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
nav:
  - 首页: index.md
  - 快速开始: quickstart.md
  - 命令索引: cli.md
  - 项目与访问: projects.md
  - 刷新与运行: operations.md
  - 架构与能力: architecture.md
